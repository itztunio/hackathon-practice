<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Practice App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding-top: 100px;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            display: inline-block;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { margin-bottom: 20px; }
        p { font-size: 20px; margin: 20px 0; min-height: 60px; }
        button {
            background: #ff7eb3;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #ff758c; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Hackathon Practice App</h1>
        <p>{{ quote }}</p>
        <button onclick="location.reload()">Get New Inspiration</button>
    </div>
</body>
</html>
